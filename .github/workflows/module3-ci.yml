name: Module 3 source CI (no private Gmail sends)
# Run this legacy module check manually. Module4 CI runs the same full suite on every push/PR.
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm --prefix backend install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:backend
      - run: npm run test:backend
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
