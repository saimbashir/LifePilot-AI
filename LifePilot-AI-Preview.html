function inbox(){return `<div class="page-enter">${head('YOUR MESSAGES','Smart inbox','Everything important, beautifully organized.',btn('New message','compose','plus'))}<div class="surface mail-surface"><div class="inbox-tabs">${['All','Unread','Important','Sent','Drafts','Suggested'].map(v=>`<button class="tab ${demo.filter===v?'active':''}" data-action="filter" data-value="${v}">${v}${v==='Unread'?`<span class="tab-count">${unread()}</span>`:''}</button>`).join('')}</div><div class="inbox-toolbar"><div class="select-wrap">${ic('list',15)}<span>All categories</span></div><div class="toolbar-spacer"></div><div class="select-wrap">${ic('list',15)} Newest first</div><span class="toolbar-count">${demo.emails.length} items</span></div><div class="mail-list" id="dynamic-mails">${demo.filter==='Drafts'?demo.drafts.map(d=>`<button class="draft-list-row" data-action="compose"><strong>${escape(d.subject)}</strong></button>`).join(''):demo.filter==='Sent'?'<div class="empty-state"><strong>Nothing sent in this demo</strong><p>All send actions are simulated.</p></div>':mailRows()}</div></div></div>`}
function read(){let m=demo.emails.find(x=>x.id===demo.selected)||demo.emails[0];return `<div class="page-enter"><div class="reader-back"><button class="plain-back" data-action="inbox">${ic('back',17)} Back to inbox</button><span>INBOX / MESSAGE DETAIL</span></div><div class="reader-layout"><article class="surface reader-panel"><div class="reader-actions"><span class="pill muted-pill"><span class="status-dot"></span> Demo message</span><div class="reader-icon-actions"><button class="icon-button" data-action="star" data-id="${m.id}">${ic('star')}</button><button class="icon-button" data-action="archive">${ic('archive')}</button></div></div><span class="category-tag ${m.color}">${m.category}</span><h1>${escape(m.subject)}</h1><div class="reader-contact"><span class="avatar avatar-large avatar-${m.color}">${m.initials}</span><div><strong>${escape(m.from)}</strong><p>${escape(m.email)} <span>to alex@example.com</span></p></div><time>${m.date}</time></div><div class="email-body">${escape(m.body)}</div>${m.attachments.map(a=>`<div class="attachment">${ic('file')}<span>${escape(a)}<small>Demo file · content unavailable</small></span></div>`).join('')}<div class="reader-footer">${btn('Generate reply','reply','spark')}${btn('Reply manually','compose','pen','button secondary')}${btn('Summarize','summary','book','button ghost')}</div></article><aside class="reader-aside"><div class="intelligence-panel"><div class="panel-eyebrow">${ic('spark',15)} AI ASSISTANCE</div>${orb(true)}<h3>Understand first.<br/>Respond with care.</h3><p>Turn a long email into a clear summary, or create a reply you can review before sending.</p>${btn('Summarize this email','summary','arrow','button lime full')}</div><div class="side-tip">${ic('shield')}<p>AI actions are simulated. No email will ever be sent from this prototype.</p></div></aside></div></div>`}
function compose(){let m=demo.emails.find(x=>x.id===demo.selected)||demo.emails[0];return `<div class="page-enter"><div class="reader-back"><button class="plain-back" data-action="approvals">${ic('back',17)} Back to drafts</button><span>AI STUDIO / COMPOSE</span></div><div class="compose-layout"><div class="surface compose-panel"><div class="compose-header"><div>${kicker('THE WRITING STUDIO')}<h1>Refine your message.</h1><p>Every word is yours to review.</p></div><span class="pill mock-pill">${ic('shield',13)} SIMULATION</span></div><div class="compose-meta"><div class="input-line"><label>To</label><input id="draft-to" value="${escape(demo.drafts[0].to||m.email)}" type="email" placeholder="recipient@example.com"/></div><div class="input-line"><label>Subject</label><input id="draft-subject" value="${escape(demo.drafts[0].subject)}" placeholder="A clear, thoughtful subject"/></div></div><div class="editor-frame"><div class="editor-toolbar"><span>MESSAGE</span><div><button data-action="bold"><b>B</b></button><button data-action="italic"><i>I</i></button><span class="toolbar-divider"></span><span class="word-indicator">LOCAL DRAFT</span></div></div><div class="editable-message" contenteditable="true" id="draft-body" role="textbox" aria-label="Message body">${escape(demo.drafts[0].body)}</div></div><div class="compose-footer"><div class="compose-tools"><button class="icon-button" data-action="attach" aria-label="Attachments">${ic('file')}</button><span class="saved-hint">${ic('check',13)} Demo draft</span></div><div class="compose-submit">${btn('Save draft','save','file','button ghost')}${btn('Request approval','request','approve')}</div></div></div><aside class="compose-aside"><div class="writing-card"><div class="panel-eyebrow">${ic('spark',15)} MOCK WRITING ASSISTANT</div>${orb(true)}<h3>Find the right words.</h3><p>Choose a tone and generate a new suggested message. All AI content here is simulated.</p><label class="field-label">Writing tone</label><div class="segmented"><button class="active" data-action="tone">Professional</button><button data-action="tone">Warm</button><button data-action="tone">Concise</button></div>${btn('Regenerate suggestion','regenerate','spark','button lime full')}<small>Template-based simulation, not a connected AI model.</small></div><div class="side-tip">${ic('shield')}<p>Approval is required before any simulated send.</p></div></aside></div></div>`}
function voice(){return `<div class="page-enter">${head('LIFEPILOT VOICE','Just say what you need.','A thoughtful interface for the way you naturally speak.')}<div class="voice-layout"><div class="voice-hero"><div class="voice-hero-head"><span>YOUR PERSONAL ASSISTANT</span><span>01 / VOICE STUDIO</span></div><div class="voice-visual">${orb()}<div class="voice-wave">${Array.from({length:21},(_,i)=>`<span style="height:${12+Math.round(48*Math.abs(Math.sin(i*1.37)))}px"></span>`).join('')}</div></div><div class="voice-status"><span class="status-led"></span> Ready to listen</div><h2>Your words, your workflow.</h2><p>Type a command to try the offline assistant demo. Microphone speech recognition is available in the full React app on supported browsers.</p><button class="mic-cta" data-action="mic">${ic('mic')} Voice preview</button></div><div class="voice-controls"><div class="command-box"><div class="command-box-header"><span>${ic('spark')} TYPE A COMMAND</span><span class="mini-demo">DEMO ENGINE</span></div><textarea id="voice-command" rows="3" placeholder="Try: Summarize my latest internship email in Roman Urdu…">${escape(demo.command)}</textarea><div class="command-actions"><span>Commands are matched with mock demo data.</span>${btn('Run command','run','spark')}</div></div><div class="examples-card"><div class="section-heading"><h3>Try asking LifePilot</h3><span>EXAMPLES</span></div>${['Show my unread emails','Summarize my latest internship email in Roman Urdu','Open the latest email from Ahmad','Reply to Ahmad about his proposal','Write a new email'].map((c,i)=>`<button class="example-command" data-action="example" data-value="${i}"><span>${escape(c)}</span>${ic('up',15)}</button>`).join('')}</div></div></div></div>`}
function summary(){let m=demo.emails.find(x=>x.id===demo.selected)||demo.emails[0];return `<div class="page-enter">${head('AI READING ROOM','Clarity in a few lines.','A reading companion for long conversations and important details.',btn('Choose another email','inbox','inbox','button secondary'))}<div class="summary-grid"><div class="surface summary-main"><div class="summary-topline"><span class="category-tag violet">${ic('spark',13)} MOCK AI SUMMARY</span><div class="language-picker">Language<select id="summary-lang"><option>Roman Urdu</option><option>English</option></select></div></div><div class="summary-selector"><label>SELECT AN EMAIL TO SUMMARIZE</label><select id="summary-select">${demo.emails.map(x=>`<option value="${x.id}" ${m.id===x.id?'selected':''}>${escape(x.subject)}</option>`).join('')}</select></div><h2>${escape(m.subject)} — Summary</h2><p class="summary-intro" id="summary-text">${escape(m.from)} ne tumhe email bheji hai. Is mein important information aur next steps diye gaye hain. Original email verify karo.</p><div class="summary-rule"></div><div class="summary-section"><div class="summary-section-icon">${ic('list')}</div><div><h3>Key takeaways</h3><ul><li>Sender ne email ke subject par important details share ki hain.</li><li>Response prepare karne se pehle original message read karo.</li><li>Is summary ka content demonstration hai.</li></ul></div></div><div class="summary-section"><div class="summary-section-icon amber">${ic('file')}</div><div><h3>Dates & requirements</h3><p class="muted-text">Verify dates directly from the original message.</p></div></div><div class="summary-bottom">${btn('Prepare a reply','reply','pen')}${btn('View original','read','book','button secondary')}</div></div><aside class="summary-right"><div class="reference-card"><div class="panel-eyebrow">SOURCE MESSAGE</div><div class="reference-sender"><span class="avatar avatar-${m.color}">${m.initials}</span><div><strong>${escape(m.from)}</strong><small>${m.date}</small></div></div><h3>${escape(m.subject)}</h3><p>${escape(m.preview)}</p><button class="link-action" data-action="read">View original email ${ic('arrow',16)}</button></div><div class="simulation-note">${ic('shield',16)} Local mock summary, no connected AI provider.</div></aside></div></div>`}
function approvals(){return `<div class="page-enter">${head('HUMAN-IN-THE-LOOP','The final word is yours.','Review every AI-generated message before it goes anywhere.',btn('New draft','compose','plus'))}<div class="approval-note">${ic('shield',22)}<div><strong>Nothing sends without your approval.</strong><p>This frontend has no live mail connection. Approving produces a simulated send only.</p></div><span>DEMO SAFE</span></div><div class="approvals-grid"><div><div class="section-title"><h2>Awaiting your review</h2><span>${demo.drafts.filter(d=>d.status==='pending').length} pending</span></div>${demo.drafts.filter(d=>d.status==='pending').map(d=>`<div class="surface approval-card"><div class="approval-card-top"><span class="pill review-pill">Awaiting approval</span><small>Nov 13</small></div><h3>${escape(d.subject)}</h3><p class="approval-recipient">To <strong>${escape(d.to)}</strong></p><p class="approval-excerpt">${escape(d.body)}</p><div class="approval-card-actions">${btn('Review & approve','approve','check')}${btn('Edit','compose','pen','button secondary')}<button class="icon-button" data-action="reject" aria-label="Reject">×</button></div></div>`).join('')||'<div class="surface"><div class="empty-state"><strong>Everything reviewed</strong><p>New drafts appear here when you request approval.</p></div></div>'}<div class="section-title section-spaced"><h2>Saved drafts</h2><span>Local preview</span></div><div class="surface compact-drafts"><button class="compact-draft" data-action="compose"><span class="draft-icon">${ic('file')}</span><span><strong>Start a thoughtful email</strong><small>Compose your message</small></span>${ic('arrow')}</button></div></div><aside><div class="approval-steps"><div class="panel-eyebrow">${ic('shield',15)} APPROVAL BY DESIGN</div><h3>You stay in control.</h3>${['LifePilot prepares a draft','You review every detail','You explicitly approve','A simulated send is recorded'].map((s,i)=>`<div class="approval-step"><span>0${i+1}</span><p>${s}</p></div>`).join('')}</div><div class="mini-status"><div class="mini-status-title">${ic('approve')} Simulation history</div><strong>${demo.drafts.filter(d=>d.status==='sent').length}</strong><p>Simulated sends completed</p></div></aside></div></div>`}
function settings(){return `<div class="page-enter">${head('MAKE IT YOURS','A workspace that feels like you.','Fine-tune your writing preferences, voice, and personal experience.')}<div class="settings-layout"><div><section class="surface settings-section"><div class="settings-section-head"><div class="settings-icon">${ic('settings')}</div><div><h2>Writing preferences</h2><p>How LifePilot prepares your messages.</p></div></div><div class="settings-fields"><label>Default language<select><option>English</option><option>Roman Urdu</option><option>Professional English</option></select></label><label>Default writing tone<select><option>Professional</option><option>Warm</option><option>Concise</option></select></label><label>Default reply length<select><option>Medium</option><option>Short</option><option>Detailed</option></select></label><label>Preferred closing<input value="Kind regards"/></label></div></section><section class="surface settings-section"><div class="settings-section-head"><div class="settings-icon sky">${ic('sun')}</div><div><h2>Appearance</h2><p>Choose the atmosphere that works for you.</p></div></div><div class="theme-choices"><button class="theme-choice ${demo.theme==='light'?'chosen':''}" data-action="light"><span class="theme-sample light-sample"><span></span><span></span><span></span></span><strong>${ic('sun',15)} Light & airy</strong></button><button class="theme-choice ${demo.theme==='dark'?'chosen':''}" data-action="dark"><span class="theme-sample dark-sample"><span></span><span></span><span></span></span><strong>${ic('moon',15)} Deep forest</strong></button></div></section></div><aside class="settings-aside"><div class="connection-card"><div class="panel-eyebrow">${ic('shield',15)} ACCOUNT CONNECTION</div><span class="connection-illustration">${ic('mail',28)}</span><h3>Gmail isn't connected yet.</h3><p>Module 1 is a frontend-only preview. Real OAuth and Gmail sync begin only after you approve the interface.</p><button class="button secondary full" data-action="notifications">${ic('shield')} Connection unavailable</button></div><div class="reset-card"><h3>Demo workspace</h3><p>All messages here are fictional.</p><button class="reset-button" data-action="reset">Reset demo data</button></div></aside></div></div>`}
function activity(){return `<div class="page-enter">${head('A CLEAR RECORD','Every step, accounted for.','A transparent history of actions in your demo workspace.')}<div class="activity-layout"><section class="surface activity-full"><div class="section-heading"><div><h2>Activity timeline</h2><p>Newest actions appear first.</p></div><span class="pill muted-pill">${demo.activities.length} events</span></div>${demo.activities.map(a=>`<div class="activity-event"><div class="event-icon">${ic('activity')}</div><div><strong>${escape(a.split(' · ')[0])}</strong><p>${escape(a.split(' · ')[1]||'Demo interaction')}</p><small>Nov 13</small></div><span class="event-demo">DEMO</span></div>`).join('')}</section><aside><div class="activity-note">${ic('shield',24)}<h3>A trustworthy timeline.</h3><p>All activity here is local and simulated. No external emails are accessed or sent.</p></div></aside></div></div>`}
function render(){document.documentElement.dataset.theme=demo.theme;root.innerHTML=demo.screen==='welcome'?landing():shell(({overview,inbox,read,compose,voice,summary,approvals,settings,activity})[demo.screen]?.()||overview());let backdrop=document.getElementById('backdrop');if(backdrop)backdrop.hidden=true;document.title='LifePilot AI — '+demo.screen.charAt(0).toUpperCase()+demo.screen.slice(1)}
function navigate(screen){demo.screen=screen;demo.search='';window.history.replaceState({},'',location.pathname+'?screen='+screen);render();scrollTo(0,0)}
function showToast(msg){let t=document.querySelector('.toast');if(t)t.remove();let element=document.createElement('div');element.className='toast';element.innerHTML=`${ic('check',18)}<span>${escape(msg)}</span>`;document.body.appendChild(element);setTimeout(()=>element.remove(),3300)}
function saveForm(){let to=document.getElementById('draft-to'),s=document.getElementById('draft-subject'),b=document.getElementById('draft-body');if(to&&s&&b){demo.drafts[0].to=to.value;demo.drafts[0].subject=s.value;demo.drafts[0].body=b.innerText;}}
const samples=['Show my unread emails','Summarize my latest internship email in Roman Urdu','Open the latest email from Ahmad','Reply to Ahmad about his proposal','Write a new email'];
root.addEventListener('click',e=>{let button=e.target.closest('[data-action]');if(!button)return;let a=button.dataset.action;
 if(nav.some(x=>x[0]===a)||a==='welcome'){navigate(a);return}
 if(a==='read'){demo.selected=button.dataset.id||demo.selected;demo.emails.find(x=>x.id===demo.selected).unread=false;navigate('read');return}
 if(a==='important'){demo.filter='Important';navigate('inbox');return}
 if(a==='filter'){demo.filter=button.dataset.value;render();return}
 if(a==='star'||a==='unread'){let m=demo.emails.find(x=>x.id===button.dataset.id);if(m)m[a==='star'?'starred':'unread']=!m[a==='star'?'starred':'unread'];render();return}
 if(a==='reply'){let m=demo.emails.find(x=>x.id===demo.selected)||demo.emails[0];demo.drafts[0]={id:'d1',to:m.email,subject:'Re: '+m.subject,body:`Dear ${m.from.split(' ')[0]},\n\nThank you for your email. I will review the details and get back to you.\n\nKind regards,\nAlex`,status:'draft'};demo.activities.unshift('Reply prepared · '+m.subject);navigate('compose');return}
 if(a==='save'||a==='request'){saveForm();demo.drafts[0].status=a==='request'?'pending':'draft';demo.activities.unshift((a==='request'?'Approval requested':'Draft saved')+' · '+demo.drafts[0].subject);navigate('approvals');showToast(a==='request'?'Draft queued for approval. Nothing sent.':'Local demo draft saved.');return}
 if(a==='approve'){if(confirm('Approve SIMULATED send? No real message will be delivered.')){demo.drafts[0].status='sent';demo.activities.unshift('Simulated send approved · '+demo.drafts[0].subject);navigate('approvals');showToast('Simulation complete — no real email was sent.')}return}
 if(a==='reject'){demo.drafts[0].status='rejected';navigate('approvals');showToast('Draft rejected — nothing sent.');return}
 if(a==='regenerate'){let m=demo.emails.find(x=>x.id===demo.selected)||demo.emails[0];let editor=document.getElementById('draft-body');if(editor){editor.innerText=`Hi ${m.from.split(' ')[0]},\n\nThanks for reaching out. I appreciate the update and will review it carefully before sharing my thoughts.\n\nBest,\nAlex`;showToast('New demo suggestion prepared.')}return}
 if(a==='theme'||a==='light'||a==='dark'){demo.theme=a==='theme'?(demo.theme==='light'?'dark':'light'):a;render();return}
 if(a==='menu'){let s=document.getElementById('sidebar');s?.classList.add('sidebar-open');let b=document.getElementById('backdrop');if(b)b.hidden=false;return}
 if(a==='menu-close'){document.getElementById('sidebar')?.classList.remove('sidebar-open');let b=document.getElementById('backdrop');if(b)b.hidden=true;return}
 if(a==='example'){demo.command=samples[Number(button.dataset.value)];let input=document.getElementById('voice-command');if(input)input.value=demo.command;runCommand(demo.command);return}
 if(a==='run'){let input=document.getElementById('voice-command');demo.command=input?.value||'';runCommand(demo.command);return}
 if(a==='mic'){showToast('This offline preview demonstrates design. The full React app supports browser speech recognition.');return}
 if(a==='archive'){showToast('Archived in demo preview.');navigate('inbox');return}
 if(a==='notifications'||a==='attach'||a==='tone'||a==='bold'||a==='italic'){showToast('Preview control — full interactive behavior is in the React app.');return}
 if(a==='reset'){if(confirm('Reset demo preview?'))location.reload();return}
});
root.addEventListener('input',e=>{if(e.target.matches('.search-bar')){demo.search=e.target.value;if(demo.screen!=='inbox'){demo.screen='inbox';render();return}let c=document.getElementById('dynamic-mails');if(c)c.innerHTML=mailRows()} });
root.addEventListener('change',e=>{if(e.target.id==='summary-select'){demo.selected=e.target.value;render()}if(e.target.id==='summary-lang'){let m=demo.emails.find(x=>x.id===demo.selected)||demo.emails[0];let t=document.getElementById('summary-text');if(t)t.textContent=e.target.value==='Roman Urdu'?`${m.from} ne tumhe email bheji hai. Original message mein dates aur requirements verify karo.`:`This message from ${m.from} discusses ${m.subject.toLowerCase()}. Please verify all details against the original email.`}});
function runCommand(q){let s=q.toLowerCase();demo.activities.unshift('Command processed · '+q);if(/unread/.test(s)){demo.filter='Unread';navigate('inbox')}else if(/summar/.test(s)){demo.selected='m1';navigate('summary')}else if(/ahmad|proposal/.test(s)){demo.selected='m2';if(/reply|respond/.test(s)){let m=demo.emails[1];demo.drafts[0]={id:'d1',to:m.email,subject:'Re: '+m.subject,body:'Hi Ahmad,\n\nThanks for sharing the updated proposal. I will review it tomorrow.\n\nBest,\nAlex',status:'draft'};navigate('compose')}else navigate('read')}else if(/write|compose|draft/.test(s)){navigate('compose')}else{showToast('Try: Show unread emails, summarize internship email, or reply to Ahmad.')}}
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('.search-bar')?.focus()}});
render();
</script></body></html>
